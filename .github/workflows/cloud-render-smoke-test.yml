name: Cloud Render Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jack-pockets-2-cloud-render-smoke
  cancel-in-progress: false

jobs:
  render-smoke-test:
    name: Render and validate a 12-second test video
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Render a 12-second 720p video with audio
        run: |
          set -euo pipefail
          mkdir -p out
          ffmpeg -hide_banner -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=30" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 12 \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            out/cloud-render-smoke-test.mp4
          test -s out/cloud-render-smoke-test.mp4

      - name: Validate video, audio, duration, resolution and checksum
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels \
            -of json out/cloud-render-smoke-test.mp4 > out/ffprobe-report.json

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("out/ffprobe-report.json").read_text())
          streams = report.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
          duration = float(report.get("format", {}).get("duration", 0))
          size = int(report.get("format", {}).get("size", 0))

          errors = []
          if video is None:
              errors.append("Missing video stream")
          else:
              if (video.get("width"), video.get("height")) != (1280, 720):
                  errors.append(f"Unexpected resolution: {video.get('width')}x{video.get('height')}")
              if video.get("r_frame_rate") != "30/1":
                  errors.append(f"Unexpected frame rate: {video.get('r_frame_rate')}")
          if audio is None:
              errors.append("Missing audio stream")
          if not 11.8 <= duration <= 12.2:
              errors.append(f"Unexpected duration: {duration:.3f}s")
          if size <= 0:
              errors.append("Output file is empty")

          print(json.dumps({
              "video": video,
              "audio": audio,
              "duration_seconds": duration,
              "size_bytes": size,
              "passed": not errors,
              "errors": errors,
          }, indent=2))

          if errors:
              raise SystemExit("; ".join(errors))
          PY

          sha256sum out/cloud-render-smoke-test.mp4 | tee out/SHA256SUMS
          {
            echo "## Cloud render smoke test passed"
            echo
            echo '- Rendered on a GitHub-hosted ubuntu-latest runner.'
            echo "- Output: 1280x720, 30 FPS, approximately 12 seconds."
            echo "- Includes H.264 video and AAC audio."
            echo "- FFprobe validation and SHA-256 checksum succeeded."
            echo "- No AI API keys or paid provider calls were used."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test video and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jack-pockets-2-cloud-render-smoke
          path: |
            out/cloud-render-smoke-test.mp4
            out/ffprobe-report.json
            out/SHA256SUMS
          if-no-files-found: warn
          retention-days: 3
